[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babkacli"
version = "0.1.0"
description = "CLI helpers for parsing agent responses and executing workspace commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-inference>=1.0.0b9",
    "python-dotenv>=1.0.0",
    "PySide6>=6.7.0",
    "qtwebview2>=0.4.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pillow>=10.0.0"]

[tool.setuptools]
packages = ["src", "src.utils", "src.system_prompts", "src.toolcall", "src.ui", "src.web_chat"]

[tool.setuptools.package-data]
"src.ui" = ["fonts/*.ttf", "assets/*.png", "assets/*.gif"]

[project.scripts]
babkacli = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
